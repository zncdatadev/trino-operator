                                      enum:
                                      - FATAL
                                      - ERROR
                                      - WARN
                                      - INFO
                                      - DEBUG
                                      - TRACE
                                      type: string
                                  type: object
                                loggers:
                                  additionalProperties:
                                    description: |-
                                      LogLevelSpec
                                      level mapping if app log level is not standard
                                        - FATAL -> CRITICAL
                                        - ERROR -> ERROR
                                        - WARN -> WARNING
                                        - INFO -> INFO
                                        - DEBUG -> DEBUG
                                        - TRACE -> DEBUG

